<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central do Cliente · Lentes KODAK</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #1a1f2e 0%, #2a2f3e 40%, #1e2332 100%);
    padding: 20px;
  }

  .login-card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    border-top: 4px solid #FDB913;
  }

  /* ── Logo area: yellow background ── */
  .logo-area {
    background: #FDB913;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
  }

  .logo-area img {
    max-width: 220px;
    width: 100%;
    height: auto;
    display: block;
  }

  /* Inline SVG logo fallback */
  .logo-kodak {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .logo-kodak .k-icon {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
  }

  .logo-kodak .brand-text {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 26px;
    line-height: 1.1;
    color: #000;
    letter-spacing: -0.5px;
  }

  .logo-kodak .brand-text span {
    display: block;
    font-size: 30px;
    letter-spacing: 2px;
  }

  /* ── Form area ── */
  .form-area {
    padding: 32px 32px 36px;
  }

  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #c75a00;
    background: #fff3e0;
    border: 1px solid #ffe0b2;
    border-radius: 20px;
    padding: 5px 14px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }

  .form-area h1 {
    font-size: 22px;
    font-weight: 700;
    color: #1a1a1a;
    margin-bottom: 4px;
  }

  .form-area h1 .accent {
    color: #e65100;
  }

  .form-area .subtitle {
    font-size: 13.5px;
    color: #888;
    margin-bottom: 28px;
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 7px;
  }

  .field input {
    width: 100%;
    padding: 13px 16px;
    font-size: 15px;
    font-family: inherit;
    border: 1.5px solid #ddd;
    border-radius: 10px;
    outline: none;
    transition: border-color .2s;
    color: #222;
    background: #fafafa;
  }

  .field input:focus {
    border-color: #FDB913;
    background: #fff;
  }

  /* ── Password wrapper with toggle fix ── */
  .password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
  }

  .password-wrapper input {
    padding-right: 80px;
  }

  .password-toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    cursor: pointer;
    font-family: inherit;
    padding: 4px 0;
    line-height: 1;
    user-select: none;
  }

  .password-toggle:hover {
    color: #e65100;
  }

  .btn-enter {
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, #f57c00, #e65100);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity .2s, transform .1s;
    margin-top: 8px;
  }

  .btn-enter:hover { opacity: .92; }
  .btn-enter:active { transform: scale(.98); }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 20px 32px 28px;
    border-top: 1px solid #f0f0f0;
  }

  .footer .footer-brand {
    font-size: 22px;
    font-weight: 600;
    color: #e65100;
    letter-spacing: -0.5px;
  }

  .footer .footer-sub {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.8px;
    color: #aaa;
    margin-top: 2px;
    text-transform: uppercase;
  }

  /* ── Responsivo ── */
  @media (max-width: 480px) {
    .login-card { border-radius: 14px; }
    .form-area { padding: 24px 22px 28px; }
    .logo-area { padding: 22px 20px; }
    .logo-kodak .brand-text { font-size: 22px; }
    .logo-kodak .brand-text span { font-size: 26px; }
    .logo-kodak .k-icon { width: 46px; height: 46px; }
  }
</style>
</head>
<body>

<div class="login-card">

  <!-- LOGO AREA — fundo amarelo Kodak -->
  <div class="logo-area">
    <div class="logo-kodak">
      <svg class="k-icon" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
        <rect width="80" height="80" rx="8" fill="#ED1C24"/>
        <path d="M20 16h10v48H20z" fill="#FDB913"/>
        <path d="M30 32l18-16h14L42 36l22 24H50L30 40z" fill="#FDB913"/>
      </svg>
      <div class="brand-text">
        Lentes
        <span>KODAK</span>
      </div>
    </div>
  </div>

  <!-- FORM -->
  <div class="form-area">
    <div style="text-align:center;">
      <div class="badge">Lentes Kodak · 2026</div>
      <h1>Acesso <span class="accent">restrito</span></h1>
      <p class="subtitle">Identifique-se para acessar a Central do Cliente.</p>
    </div>

    <div class="field">
      <label>Seu nome</label>
      <input type="text" value="Rafael" autocomplete="name">
    </div>

    <div class="field">
      <label>Senha</label>
      <div class="password-wrapper">
        <input type="password" id="pwd" value="12345678" autocomplete="current-password">
        <button type="button" class="password-toggle" onclick="togglePwd()">Ocultar</button>
      </div>
    </div>

    <button class="btn-enter" onclick="void(0)">Entrar</button>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-brand">molla</div>
    <div class="footer-sub">Central do Cliente · Agência Molla</div>
  </div>

</div>

<script>
function togglePwd() {
  const inp = document.getElementById('pwd');
  const btn = inp.nextElementSibling;
  if (inp.type === 'password') {
    inp.type = 'text';
    btn.textContent = 'Ocultar';
  } else {
    inp.type = 'password';
    btn.textContent = 'Mostrar';
  }
}
</script>
</body>
</html>
